# Radar visibility. Press F6 to change these options in game.
# Changes apply immediately and are saved here.

[radar]
clock=true
treasure=true
boss=true
assault=true
mini_games=true
area_quests=true
bird_eggs=true

[map]
treasure=true
boss=true
assault=true
mini_games=true
area_quests=true

[scene]
# Main-view guidance. Enabled categories share one marker limit. Zero range or limit hides all.
treasure=true
area_quests=true
mini_games=true
range_meters=600
marker_limit=24
distance_mode=nearest_center

[modes]
# available: show only currently eligible entries; all: show every unfinished entry.
area_quests=available
assault=available

[height_arrows]
# Compact-radar height indicators. These do not hide markers.
treasure=true
area_quests=true
mole=true
boss=true
assault=true

[interface]
# auto reads the game's LanguageText on each F7 and each actual F6 opening;
# failed providers retain the last valid language (English before the first sample).
language=auto

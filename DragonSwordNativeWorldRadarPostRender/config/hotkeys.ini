[hotkeys]
# Edit while the game is closed, then restart. These are three distinct actions.
# Supported (case-insensitive): F1-F24, A-Z, 0-9, NUM0-NUM9,
# HOME, END, PAGEUP, PAGEDOWN, INSERT, DELETE, SPACE.
# Example: settings_hotkey=INSERT, enable_hotkey=HOME, disable_hotkey=PAGEUP
# Put each setting on its own line. All three keys must be different.
# Avoid bindings used by the game or another Mod (AutoPickup defaults to F9).
# Missing or invalid configuration uses ALL defaults F6/F7/F8; no partial remap.
# Display/filter/language settings are in visibility.ini; logging in diagnostics.ini.
settings_hotkey=F6
enable_hotkey=F7
disable_hotkey=F8

[auto_pickup]
# Automatic pickup starts disabled. Press the configured toggle key to enable
# it and press the same key again to disable it. Holding the key does not repeat
# the transition; release is required before another press. Each due scan calls
# the game's native selector once. Only one automatic action may be pending.
# Exact Actor or Component invalidation, or the exact Component becoming
# non-interactable, confirms success. A first 650 ms timeout permits one retry
# after a 100 ms cooldown; a second timeout quarantines only that exact
# Component for the current activation. Other candidates may still proceed.
# AUTO reads the
# saved semantic INTERACT keyboard binding once whenever F9 enables the Mod
# instead of assuming the physical F key. Treasure boxes remain excluded.
#
# The installer-offered 3x, 5x, 10x, 15x, and 20x PAK alternatives change the
# game's authored native F range. They also contain matching edited interaction
# spheres for all 19 reviewed type-7 DropItemActor packages, so ordinary meat,
# aged meat, and the other reviewed monster drops use the selected distance.
# The native Mod does not multiply range at runtime. The PAKs do not mutate
# root, physics, or hit collision. Auto Pickup also works with Original range.
#
# Public release default: diagnostics are off. Set this to true only for a local
# troubleshooting session; action diagnostics are compact and timing remains
# interval-aggregated.
enabled_on_launch=false
automatic_pickup=true
# Supported names: F1-F24, A-Z, 0-9, NUM0-NUM9, HOME, END, PAGEUP,
# PAGEDOWN, INSERT, DELETE, SPACE. Avoid keys already used by the game or another Mod.
toggle_hotkey=F9
# AUTO is recommended. After changing the game's interaction key, toggle F9
# off and on to reload it. If the saved semantic binding cannot be read,
# interaction_key_fallback is used for that enable session. Enter the exact
# Unreal FKey name currently mapped to interaction, such as F, E, K, or
# Gamepad_FaceButton_Bottom. A concrete interaction_key remains available as a
# fail-closed manual override for troubleshooting.
interaction_key=AUTO
interaction_key_fallback=F
debug_logging=false
perf_log_interval_seconds=10
slow_scan_threshold_us=1000

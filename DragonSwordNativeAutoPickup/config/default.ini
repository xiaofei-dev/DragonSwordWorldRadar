[auto_pickup]
# F9 arms the owner-authorized runtime canary. Active pickup additionally
# requires a trusted fingerprint and a fresh valid local-player pulse.
enabled_on_launch=false
passive_observation=true
toggle_hotkey=F9
radius_meters=4.5
max_queue=128
max_retries=2
action_interval_ms=150
retry_backoff_ms=500
perf_log_interval_seconds=30
